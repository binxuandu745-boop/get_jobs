spring:
  servlet:
    multipart:
      max-file-size: 8MB # 离线截图入口；后端同时校验实际文件内容与尺寸
      max-request-size: 25MB # 同一岗位最多6张、合计24MiB，余量用于multipart边界和规则
  application:
    name: get_jobs
  profiles:
    active: dev
  info:
    app:
      name: Get Jobs
      version: 2.0.1
      description: https://github.com/loks666/get_jobs
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  datasource:
    url: jdbc:sqlite:./db/getjobs.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      connection-test-query: SELECT 1
  sql:
    init:
      mode: never  # 数据库文件已存在，不需要自动初始化
  output:
    ansi:
      enabled: always

# 服务器配置
server:
  address: 127.0.0.1  # 管理接口只允许本机访问
  port: 9527  # 后端 API 固定端口（别用 9679：落在 Windows Hyper-V 保留段 9628-9727 里，绑不上）

# 日志配置
logging:
  level:
    root: INFO
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr([%thread]){magenta} %clr(%-5level){highlight} %clr(%logger{36}){cyan} %clr(-){faint} %msg%n"
  file:
    name: ./target/logs/get-jobs.log
  logback:
    rollingpolicy:
      max-history: 30
      max-file-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: true  # 打开 MyBatis Plus 启动 banner
    db-config:
      id-type: auto
  mapper-locations: classpath*:/mapper/**/*.xml

# 本机已安装 Chrome Canary；使用项目独立的 browser-data 目录。
getjobs:
  browser:
    channel: chrome-canary
    platform-mode: liepin # 未保存前端选择时的启动默认值；支持boss/liepin/51job/zhilian；all仅旧配置兼容
    boss-only: true # 仅作旧配置兼容；当前只初始化猎聘
  boss:
    screenshot-analysis-enabled: false # 默认使用原岗位详情数据筛选；网页保存的截图开关优先
    preview-only: false # 允许真实投递；启动助手本身不会自动发起任务
    manual-filter-setup-enabled: true # 每次手动开始后，在BOSS网页提供一次筛选设置时间
    manual-filter-setup-wait-ms: 10000 # 列表加载后等待10秒，后续自动轮次沿用手动选择
    auto-rounds-enabled: true # 手动开始后顺序运行各轮；停止、保护性暂停或异常不会自动重启
    round-size: 50 # 每轮成功发送招呼的上限，过滤和重复岗位不计入
    total-target: 150 # 本次手动启动的累计投递目标，达到后结束
    max-rounds: 30 # 岗位不足时防止无限空转
    max-empty-rounds: 3 # 连续三轮无新增投递时结束并提示检查条件
    pause-desktop-alert-enabled: true # 保护性暂停时弹出桌面置顶提示，关闭提示不会恢复任务
    detail-response-timeout-ms: 60000 # 详情响应等待上限；超时为读取失败，不等同于安全验证
    list-page-diagnosis-enabled: true # 下一批岗位超时后，复用截图AI配置诊断一次；无法确认仍暂停
    max-preview-jobs: 5
    required-role-terms: "Java,后端,服务端"
    require-internship: false # 不因标题或描述缺少“实习”而排除 Java／后端岗位
#    action-delay-min-ms: 2000 # 岗位处理步骤之间的最短等待，单位毫秒
#    action-delay-max-ms: 4000 # 每次在最短与最长等待之间取随机值
#    mouse-movement-enabled: true # 每次点击前在页面内分段移动鼠标；不接管系统鼠标
#    mouse-movement-min-ms: 450 # 单次移动的计划耗时下限，实际还包含浏览器调用耗时
#    mouse-movement-max-ms: 1100 # 每次随机耗时并缓入缓出；移动期间仍检查停止与岗位身份
#
    action-delay-min-ms: 50 # 岗位处理步骤之间的最短等待，单位毫秒
    action-delay-max-ms: 500 # 每次在最短与最长等待之间取随机值
    mouse-movement-enabled: true # 每次点击前在页面内分段移动鼠标；不接管系统鼠标
    mouse-movement-min-ms: 450 # 单次移动的计划耗时下限，实际还包含浏览器调用耗时
    mouse-movement-max-ms: 1100 # 与450毫秒下限组成有效随机范围；实际还包含浏览器调用耗时
    mouse-target-randomization-enabled: true # 在目标内选取落点，最终点击沿用该点；关闭则恢复中心落点
    mouse-target-inset-ratio: 0.25 # 四边各内缩25%，在中间50%区域取点；有效范围0.05至0.45
    mouse-path-variation-enabled: true # 可变落点模式下使用独立控制点曲线；false沿用原弧线




    minimum-monthly-salary: 5000
    minimum-daily-salary: 125 # 用户确认接受125元/天及以上的日薪实习
    random-city-enabled: true # 每次开始任务时随机选一城，任务内保持不变
    random-city-pool: "101010100,101020100,101280600,101280100,101210100,101270100,101190100,101200100,101190400,101110100"
  liepin:
    action-delay-min-ms: 2000 # 与当前BOSS源码配置一致；只在真实岗位处理/搜索/翻页/沟通前等待
    action-delay-max-ms: 4000
    required-role-terms: "Java,后端,服务端"
    require-internship: false # 不新增实习字样硬限制
    minimum-monthly-salary: 4500 # 用户已确认其他平台以4500元/月保底
    minimum-daily-salary: 125 # 日薪下限独立判断；不换算月薪
    communication-confirm-timeout-ms: 15000 # 只读等待同岗位“继续聊”证据；不自动重复点击
